name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Generate coverage for pkg/common
        run: |
          cd pkg/common
          GOWORK=off go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./pkg/common/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

  complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install gocyclo
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
      - name: Run gocyclo
        run: |
          gocyclo -over 10 ./services/... ./pkg/...
        continue-on-error: true

  code-standards:
    name: Code Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l ./pkg ./services 2>/dev/null || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files are not formatted:"
            echo "$UNFORMATTED"
            gofmt -d ./pkg ./services
            exit 1
          fi
          echo "✅ All Go files are properly formatted"
      - name: Check imports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          UNORGANIZED=$(goimports -l ./pkg ./services 2>/dev/null || true)
          if [ -n "$UNORGANIZED" ]; then
            echo "Go imports are not organized:"
            echo "$UNORGANIZED"
            goimports -d ./pkg ./services
            exit 1
          fi
          echo "✅ All Go imports are properly organized"

  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint code
        run: cd frontend && npm run lint
      - name: Type check
        run: cd frontend && npm run type-check
      - name: Build verification
        run: cd frontend && npm run build

  git-secrets:
    name: Git Secrets Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets
          sudo make install
          cd ..
          rm -rf git-secrets
      - name: Configure git-secrets
        run: |
          git secrets --install
          git secrets --register-aws
      - name: Scan for secrets
        run: |
          git secrets --scan

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
        continue-on-error: true

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: 'Dockerfile'
        continue-on-error: true
      - name: Lint service Dockerfiles
        run: |
          for service in auth-service inventory-service project-service scanner-service \
                         warehouse-service invoice-service document-service crew-service \
                         federation-service maintenance-service transport-service insurance-service \
                         workflow-service ai-service notification-service reporting-service \
                         audit-service expense-service; do
            if [ -f "services/$service/Dockerfile" ]; then
              echo "Checking services/$service/Dockerfile..."
              docker run --rm -i hadolint/hadolint < "services/$service/Dockerfile" || true
            fi
          done

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: '.github/'
        continue-on-error: true
