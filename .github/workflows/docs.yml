name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        continue-on-error: true
      - name: Build documentation
        run: |
          echo "Building documentation..."
          if [ -f "docs/index.md" ]; then
            echo "Documentation structure found"
          fi
          mkdir -p _site
          cp -r docs/* _site/ || true
          cp README.md _site/README.md || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy Documentation
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation completeness
        run: |
          echo "Validating documentation structure..."
          required_docs=(
            "docs"
            "README.md"
          )
          for doc in "${required_docs[@]}"; do
            if [ ! -e "$doc" ]; then
              echo "Missing required documentation: $doc"
              exit 1
            fi
          done
          echo "✅ Documentation structure is complete"
      - name: Validate markdown
        run: |
          echo "Checking for common markdown issues..."
          files=$(find . -name "*.md" -type f)
          for file in $files; do
            if grep -q '\[.*\](.*[^)]$' "$file"; then
              echo "Found unclosed markdown links in $file"
              exit 1
            fi
          done
          echo "✅ Markdown files are valid"
