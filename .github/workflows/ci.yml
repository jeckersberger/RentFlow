name: CI

on:
  push:
    branches: [Main, develop]
  pull_request:
    branches: [Main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-common:
    name: Test pkg/common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Run tests
        working-directory: pkg/common
        env:
          GOWORK: 'off'
        run: go test -v -race ./...

  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - inventory-service
          - project-service
          - scanner-service
          - warehouse-service
          - invoice-service
          - document-service
          - crew-service
          - federation-service
          - maintenance-service
          - transport-service
          - insurance-service
          - workflow-service
          - ai-service
          - notification-service
          - reporting-service
          - audit-service
          - expense-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: 'off'
        run: go test -v -race ./...

  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - inventory-service
          - project-service
          - scanner-service
          - warehouse-service
          - invoice-service
          - document-service
          - crew-service
          - federation-service
          - maintenance-service
          - transport-service
          - insurance-service
          - workflow-service
          - ai-service
          - notification-service
          - reporting-service
          - audit-service
          - expense-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build
        working-directory: services/${{ matrix.service }}
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: go build ./cmd/server

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:run
      - name: Build
        working-directory: frontend
        run: npm run build

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test-common, test-services, build-services, frontend]
    if: always()
    steps:
      - name: Require all baseline checks
        env:
          COMMON: ${{ needs.test-common.result }}
          SERVICES: ${{ needs.test-services.result }}
          BUILDS: ${{ needs.build-services.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          printf 'pkg/common: %s\nservices: %s\nbuilds: %s\nfrontend: %s\n' "$COMMON" "$SERVICES" "$BUILDS" "$FRONTEND"
          test "$COMMON" = success
          test "$SERVICES" = success
          test "$BUILDS" = success
          test "$FRONTEND" = success
