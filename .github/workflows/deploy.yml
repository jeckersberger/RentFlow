name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.timestamp.outputs.value }}
      deployment_id: ${{ steps.id.outputs.value }}
    steps:
      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
      - name: Generate deployment ID
        id: id
        run: echo "value=${{ github.run_id }}_${{ github.run_number }}" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        service:
          - auth-service
          - inventory-service
          - project-service
          - scanner-service
          - warehouse-service
          - invoice-service
          - document-service
          - crew-service
          - federation-service
          - maintenance-service
          - transport-service
          - insurance-service
          - workflow-service
          - ai-service
          - notification-service
          - reporting-service
          - audit-service
          - expense-service
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.inputs.environment }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ needs.prepare.outputs.timestamp }}
            VCS_REF=${{ github.sha }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Deploy to ${{ github.inputs.environment }}
        run: |
          echo "Frontend deployment to ${{ github.inputs.environment }} would occur here"
          echo "Build artifacts ready at: frontend/dist"
          echo "Deployment ID: ${{ needs.prepare.outputs.deployment_id }}"
        env:
          ENVIRONMENT: ${{ github.inputs.environment }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run smoke tests
        run: |
          echo "Running smoke tests against ${{ github.inputs.environment }} environment"
          echo "Would verify critical API endpoints and health checks"
        env:
          ENVIRONMENT: ${{ github.inputs.environment }}
          API_URL: ${{ secrets[format('API_URL_{0}', github.inputs.environment)] }}

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [prepare, smoke-tests]
    if: success()
    steps:
      - name: Verify services
        run: |
          echo "Verifying all services deployed to ${{ github.inputs.environment }}"
          echo "Deployment timestamp: ${{ needs.prepare.outputs.timestamp }}"
          echo "Deployment ID: ${{ needs.prepare.outputs.deployment_id }}"
      - name: Create deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ github.inputs.environment }}',
              description: 'Deployment ${{ needs.prepare.outputs.deployment_id }}',
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'Deployment completed successfully',
              environment_url: 'https://${{ github.inputs.environment }}.rentflow.dev'
            });

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [prepare, verify-deployment]
    if: success()
    steps:
      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully"
          echo "Environment: ${{ github.inputs.environment }}"
          echo "Timestamp: ${{ needs.prepare.outputs.timestamp }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
