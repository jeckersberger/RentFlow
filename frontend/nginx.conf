user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 100M;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml application/atom+xml image/svg+xml
             text/x-component text/x-cross-domain-policy;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http: https:;" always;

  # Direct routing to Go microservices (bypassing Traefik for dev)
  upstream auth_backend      { server auth-service:8001; }
  upstream inventory_backend { server inventory-service:8002; }
  upstream project_backend   { server project-service:8003; }
  upstream scanner_backend   { server scanner-service:8004; }
  upstream warehouse_backend { server warehouse-service:8005; }
  upstream invoice_backend   { server invoice-service:8006; }
  upstream document_backend  { server document-service:8007; }
  upstream crew_backend      { server crew-service:8008; }
  upstream federation_backend { server federation-service:8009; }
  upstream maintenance_backend { server maintenance-service:8010; }
  upstream transport_backend { server transport-service:8011; }
  upstream insurance_backend { server insurance-service:8012; }
  upstream workflow_backend  { server workflow-service:8013; }
  upstream ai_backend        { server ai-service:8014; }
  upstream notification_backend { server notification-service:8015; }
  upstream reporting_backend { server reporting-service:8016; }
  upstream audit_backend     { server audit-service:8017; }
  upstream expense_backend   { server expense-service:8018; }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # API routing - direct to microservices
    location /api/v1/auth   { proxy_pass http://auth_backend; include /etc/nginx/proxy_params; }
    location /api/v1/setup  { proxy_pass http://auth_backend; include /etc/nginx/proxy_params; }
    location /api/v1/users  { proxy_pass http://auth_backend; include /etc/nginx/proxy_params; }
    location /api/v1/tenants { proxy_pass http://auth_backend; include /etc/nginx/proxy_params; }
    location /api/v1/equipment { proxy_pass http://inventory_backend; include /etc/nginx/proxy_params; }
    location /api/v1/categories { proxy_pass http://inventory_backend; include /etc/nginx/proxy_params; }
    location /api/v1/flightcases { proxy_pass http://inventory_backend; include /etc/nginx/proxy_params; }
    location /api/v1/projects { proxy_pass http://project_backend; include /etc/nginx/proxy_params; }
    location /api/v1/packlists { proxy_pass http://project_backend; include /etc/nginx/proxy_params; }
    location /api/v1/reservations { proxy_pass http://project_backend; include /etc/nginx/proxy_params; }
    location /api/v1/customers { proxy_pass http://project_backend; include /etc/nginx/proxy_params; }
    location /api/v1/scan   { proxy_pass http://scanner_backend; include /etc/nginx/proxy_params; }
    location /api/v1/scanner { proxy_pass http://scanner_backend; include /etc/nginx/proxy_params; }
    location /api/v1/locations { proxy_pass http://warehouse_backend; include /etc/nginx/proxy_params; }
    location /api/v1/movements { proxy_pass http://warehouse_backend; include /etc/nginx/proxy_params; }
    location /api/v1/inventory { proxy_pass http://warehouse_backend; include /etc/nginx/proxy_params; }
    location /api/v1/warehouses { proxy_pass http://warehouse_backend; include /etc/nginx/proxy_params; }
    location /api/v1/invoices { proxy_pass http://invoice_backend; include /etc/nginx/proxy_params; }
    location /api/v1/quotes  { proxy_pass http://invoice_backend; include /etc/nginx/proxy_params; }
    location /api/v1/credit-notes { proxy_pass http://invoice_backend; include /etc/nginx/proxy_params; }
    location /api/v1/dunning { proxy_pass http://invoice_backend; include /etc/nginx/proxy_params; }
    location /api/v1/export  { proxy_pass http://invoice_backend; include /etc/nginx/proxy_params; }
    location /api/v1/documents { proxy_pass http://document_backend; include /etc/nginx/proxy_params; }
    location /api/v1/templates { proxy_pass http://document_backend; include /etc/nginx/proxy_params; }
    location /api/v1/crew    { proxy_pass http://crew_backend; include /etc/nginx/proxy_params; }
    location /api/v1/time-entries { proxy_pass http://crew_backend; include /etc/nginx/proxy_params; }
    location /api/v1/federation { proxy_pass http://federation_backend; include /etc/nginx/proxy_params; }
    location /api/v1/maintenance { proxy_pass http://maintenance_backend; include /etc/nginx/proxy_params; }
    location /api/v1/dguv   { proxy_pass http://maintenance_backend; include /etc/nginx/proxy_params; }
    location /api/v1/transport { proxy_pass http://transport_backend; include /etc/nginx/proxy_params; }
    location /api/v1/policies { proxy_pass http://insurance_backend; include /etc/nginx/proxy_params; }
    location /api/v1/claims  { proxy_pass http://insurance_backend; include /etc/nginx/proxy_params; }
    location /api/v1/workflows { proxy_pass http://workflow_backend; include /etc/nginx/proxy_params; }
    location /api/v1/ai      { proxy_pass http://ai_backend; include /etc/nginx/proxy_params; }
    location /api/v1/notifications { proxy_pass http://notification_backend; include /etc/nginx/proxy_params; }
    location /api/v1/mail { proxy_pass http://notification_backend; include /etc/nginx/proxy_params; }
    location /api/v1/reports { proxy_pass http://reporting_backend; include /etc/nginx/proxy_params; }
    location /api/v1/audit   { proxy_pass http://audit_backend; include /etc/nginx/proxy_params; }
    location /api/v1/expenses { proxy_pass http://expense_backend; include /etc/nginx/proxy_params; }

    # Service health check proxies (for admin panel)
    location /api/health/auth       { proxy_pass http://auth_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/inventory  { proxy_pass http://inventory_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/project    { proxy_pass http://project_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/scanner    { proxy_pass http://scanner_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/warehouse  { proxy_pass http://warehouse_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/invoice    { proxy_pass http://invoice_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/document   { proxy_pass http://document_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/crew       { proxy_pass http://crew_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/federation { proxy_pass http://federation_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/maintenance { proxy_pass http://maintenance_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/transport  { proxy_pass http://transport_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/insurance  { proxy_pass http://insurance_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/workflow   { proxy_pass http://workflow_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/ai         { proxy_pass http://ai_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/notification { proxy_pass http://notification_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/reporting  { proxy_pass http://reporting_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/audit      { proxy_pass http://audit_backend/health; include /etc/nginx/proxy_params; }
    location /api/health/expense    { proxy_pass http://expense_backend/health; include /etc/nginx/proxy_params; }

    # Static files - cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # SPA routing - serve index.html for all non-API, non-static routes
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=3600";
    }

    # Deny access to dotfiles and hidden directories
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
