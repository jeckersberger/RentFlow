groups:
  - name: rentflow_alerts
    interval: 30s
    rules:
      # Service Down Alert
      - alert: ServiceDown
        expr: up{job=~"auth-service|inventory-service|project-service|scanner-service|warehouse-service|invoice-service|document-service|crew-service|federation-service|maintenance-service|transport-service|insurance-service|workflow-service|ai-service|notification-service|reporting-service|audit-service|expense-service"} == 0
        for: 2m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on instance {{ $labels.instance }} has been unreachable for more than 2 minutes."

      # High Error Rate Alert (>5% 5xx responses)
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
          /
          sum(rate(http_requests_total[5m])) by (job)) > 0.05
        for: 5m
        labels:
          severity: warning
          component: http
        annotations:
          summary: "High error rate detected in {{ $labels.job }}"
          description: "Service {{ $labels.job }} has error rate above 5% (current: {{ $value | humanizePercentage }})"

      # High Latency Alert (p95 > 2s)
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "High latency detected in {{ $labels.job }}"
          description: "Service {{ $labels.job }} p95 latency is {{ $value | humanizeDuration }} (threshold: 2s)"

      # Postgres Connection Pool Exhaustion
      - alert: PostgresConnectionPoolExhaustion
        expr: |
          pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Postgres connection pool near capacity"
          description: "Database connection pool is at {{ $value | humanizePercentage }} capacity"

      # Redis Memory Usage High
      - alert: RedisHighMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is at {{ $value | humanizePercentage }} of maximum"

      # KurrentDB Disk Space Low
      - alert: KurrentDBLowDiskSpace
        expr: |
          node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint="/var/lib/eventstore"} / node_filesystem_size_bytes < 0.1
        for: 10m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "KurrentDB disk space low"
          description: "KurrentDB storage has less than 10% free space available"
