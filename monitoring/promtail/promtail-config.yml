server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      - source_labels: ['__meta_docker_container_network_mode']
        target_label: 'network_mode'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - cri: {}
      - multiline:
          line_start_pattern: '^\d{4}-\d{2}-\d{2}'
      - regex:
          expression: '^(?P<timestamp>\d+-\d+-\d+[T ]\d+:\d+:\d+[.,]\d+([Z+-]\d{2}:?\d{2})?) (?P<level>\w+) (?P<msg>.*)$'
      - labels:
          level:
          msg:
          timestamp:
      - timestamp:
          format: RFC3339Nano
          location: UTC

  - job_name: syslog
    syslog_sd_configs:
      - listen_address: 0.0.0.0:514
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d+-\d+-\d+ \d+:\d+:\d+) (?P<hostname>\S+) (?P<app_name>\S+)\[(?P<pid>\d+)\]: (?P<msg>.*)$'
      - labels:
          hostname:
          app_name:
          pid:
      - timestamp:
          format: 2006-01-02 15:04:05
          location: UTC
