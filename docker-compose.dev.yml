version: '3.8'

# Development overrides - use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# Features:
# - No Traefik TLS/HTTPS
# - All ports exposed for direct access
# - Services use "go run" with hot reload (replaces build)
# - Seed data enabled
# - Debug logging enabled
# - Healthchecks disabled for faster iteration

services:
  traefik:
    environment:
      - LETSENCRYPT_EMAIL=dev@local
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    healthcheck:
      disable: true

  postgres:
    environment:
      POSTGRES_USER: rentflow
      POSTGRES_PASSWORD: rentflow_dev
    healthcheck:
      disable: true

  redis:
    healthcheck:
      disable: true

  kurrentdb:
    healthcheck:
      disable: true

