version: '3.8'

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  traefik:
    image: traefik:v3.1
    container_name: rentflow-traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/certs
    environment:
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@rentflow.example.com}
    networks:
      - rentflow
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`) || PathPrefix(`/api/rawdata`)"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"

  kurrentdb:
    image: eventstore/eventstore:latest
    container_name: rentflow-kurrentdb
    environment:
      EVENTSTORE_CLUSTER_SIZE: 1
      EVENTSTORE_RUN_PROJECTIONS: All
      EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_ALLOW_UNKNOWN_OPTIONS: "true"
    ports:
      - "1113:1113"
      - "2113:2113"
    volumes:
      - kurrentdb_data:/var/lib/eventstore
    networks:
      - rentflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2113/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: rentflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentflow_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - rentflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-rentflow_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rentflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: rentflow-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
    networks:
      - rentflow
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # ============================================================================
  # DATABASE MIGRATIONS (one-shot init container)
  # ============================================================================

  migrations:
    image: postgres:16-alpine
    container_name: rentflow-migrations
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-rentflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-rentflow_dev}
    volumes:
      - ./scripts:/scripts:ro
      - ./services:/services:ro
    entrypoint: ["bash", "/scripts/migrate-internal.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - rentflow
    restart: "no"

  # ============================================================================
  # MICROSERVICES (18 services)
