      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "127.0.0.1:8018:8018"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cratedesk
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.expense.rule=PathPrefix(`/api/v1/expense-categories`) || PathPrefix(`/api/v1/expenses`)"
      - "traefik.http.services.expense.loadbalancer.server.port=8018"

  # =============================================================================
  # Invoice Service (Port 8006)
  # =============================================================================
  invoice:
    build:
      context: .
      dockerfile: services/invoice/Dockerfile
    container_name: cratedesk-invoice
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-cratedesk}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: invoice_service
      DB_SSLMODE: disable
      PORT: "8006"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cratedesk
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.invoice.rule=PathPrefix(`/api/v1/invoices`) || PathPrefix(`/api/v1/quotes`) || PathPrefix(`/api/v1/dunning`) || PathPrefix(`/api/v1/banking`) || PathPrefix(`/api/v1/export`)"
      - "traefik.http.services.invoice.loadbalancer.server.port=8006"

  # =============================================================================
  # Frontend (React + Vite, served by nginx)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cratedesk-frontend
    restart: unless-stopped
    networks:
      - cratedesk
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Netzwerk
# =============================================================================
networks:
  cratedesk:
    name: cratedesk
    driver: bridge
