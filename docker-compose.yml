services:
  # =============================================================================
  # PostgreSQL 16 — eine DB pro Service
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cratedesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cratedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: cratedesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    # SECURITY: Only bind to localhost — NEVER expose DB to internet (BSI CERT-Bund 2026-03-31)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cratedesk}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - cratedesk

  # =============================================================================
  # Redis 7 — Sessions, Cache, Pub/Sub
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: cratedesk-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD muss gesetzt sein} --appendonly yes
    volumes:
      - redis_data:/data
    # SECURITY: Only bind to localhost — no internet access needed
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - cratedesk

  # =============================================================================
  # Traefik v3.1 — Reverse Proxy (Production-Routing)
  # =============================================================================
  traefik:
    image: traefik:latest
    container_name: cratedesk-traefik
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.43"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=cratedesk"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cratedesk
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =============================================================================
  # Auth Service (Port 8001)
  # =============================================================================
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: cratedesk-auth
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-cratedesk}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: auth_service
      DB_SSLMODE: disable
      PORT: "8001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cratedesk
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/setup`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8001"

