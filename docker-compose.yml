  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: rentflow-auth-service
    environment:
      SERVICE_NAME: auth-service
      SERVICE_PORT: "8001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_service
      DB_USER: ${POSTGRES_USER:-rentflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rentflow_dev}
      KURRENTDB_HOST: kurrentdb
      KURRENTDB_PORT: "2113"
      KURRENTDB_SCHEME: "http"
      KURRENTDB_USER: admin
      KURRENTDB_PASSWORD: ${KURRENTDB_PASSWORD:-rentflow_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rentflow_dev}
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRY_HOURS: "24"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8001:8001"
    depends_on:
      migrations: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kurrentdb: { condition: service_healthy }
    networks:
      - rentflow
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/tenants`) || PathPrefix(`/api/v1/setup`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

