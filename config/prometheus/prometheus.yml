global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    cluster: rentflow

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: /metrics

  - job_name: 'go-services'
    static_configs:
      - targets:
          - 'auth-service:8001'
          - 'inventory-service:8002'
          - 'project-service:8003'
          - 'scanner-service:8004'
          - 'warehouse-service:8005'
          - 'invoice-service:8006'
          - 'document-service:8007'
          - 'crew-service:8008'
          - 'federation-service:8009'
          - 'maintenance-service:8010'
          - 'transport-service:8011'
          - 'insurance-service:8012'
          - 'workflow-service:8013'
          - 'ai-service:8014'
          - 'notification-service:8015'
          - 'reporting-service:8016'
          - 'audit-service:8017'
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: /metrics

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics

  - job_name: 'kurrentdb'
    static_configs:
      - targets: ['kurrentdb:2113']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
