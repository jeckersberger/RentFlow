groups:
  - name: service_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job="go-services"} == 0
        for: 1m
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been down for more than 1 minute"

      - alert: HighErrorRate
        expr: rate(http_request_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        annotations:
          summary: "High error rate on {{ $labels.instance }}"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        annotations:
          summary: "High latency on {{ $labels.instance }}"
          description: "p95 latency is {{ $value }}s"

  - name: infrastructure
    interval: 30s
    rules:
      - alert: DiskUsageHigh
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes < 0.15
        for: 5m
        annotations:
          summary: "Disk usage is high"
          description: "Less than 15% disk space available"

      - alert: MemoryUsageHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 5m
        annotations:
          summary: "Memory usage is high"
          description: "{{ $value | humanizePercentage }} of memory in use"

      - alert: CPUUsageHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"

  - name: database
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: pg_up{job="postgresql"} == 0
        for: 1m
        annotations:
          summary: "PostgreSQL is down"

      - alert: PostgreSQLConnectionPoolExhausted
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        annotations:
          summary: "PostgreSQL connection pool usage is high"
          description: "{{ $value | humanizePercentage }} of connection pool in use"

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_slow_queries_total[5m]) > 0.1
        for: 5m
        annotations:
          summary: "High rate of slow queries"

  - name: events
    interval: 30s
    rules:
      - alert: KurrentDBSubscriptionLag
        expr: kurrentdb_subscription_lag > 1000
        for: 5m
        annotations:
          summary: "KurrentDB subscription lag is high"
          description: "Subscription is {{ $value }} events behind"

      - alert: EventAppendRateHigh
        expr: rate(kurrentdb_append_events_total[5m]) > 10000
        annotations:
          summary: "Very high event append rate"
          description: "{{ $value }} events/sec"
