http:
  middlewares:
    securityHeaders:
      headers:
        accessControlAllowOriginList:
          - https://${DOMAIN}
          - https://*.${DOMAIN}
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
        accessControlExposeHeaders:
          - X-Total-Count
          - X-Page-Number
        accessControlMaxAge: 86400
        accessControlAllowCredentials: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

    rateLimit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    gzip:
      compress:
        minResponseBodyBytes: 1024

    circuitBreaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.5"
        checkInterval: 100ms
        fallbackDuration: 10s
        maxRequests: 1

    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    cors:
      headers:
        accessControlAllowOriginList:
          - https://${DOMAIN}
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization

    dashboard-auth:
      basicAuth:
        users:
          - "admin:${DASHBOARD_HTPASSWD}"

    metrics-auth:
      basicAuth:
        users:
          - "metrics:${METRICS_HTPASSWD}"

  routers:
    api-router:
      rule: "Host(`{{ env \"DOMAIN\" }}`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      service: api-service
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
        - rateLimit
        - circuitBreaker
        - retry
        - gzip

    frontend-router:
      rule: "Host(`{{ env \"DOMAIN\" }}`)"
      entryPoints:
        - websecure
      service: frontend-service
      tls:
        certResolver: letsencrypt
      middlewares:
        - securityHeaders
        - gzip
      priority: 1

    dashboard:
      rule: "Host(`{{ env \"DOMAIN\" }}`) && PathPrefix(`/admin/dashboard`)"
      entryPoints:
        - websecure
      service: api@internal
      tls:
        certResolver: letsencrypt
      middlewares:
        - dashboard-auth
        - securityHeaders

    prometheus:
      rule: "Host(`{{ env \"DOMAIN\" }}`) && PathPrefix(`/metrics`)"
      entryPoints:
        - websecure
      service: prometheus-service
      tls:
        certResolver: letsencrypt
      middlewares:
        - metrics-auth

  services:
    api-service:
      weighted:
        services:
          - name: auth-service
            weight: 1
          - name: inventory-service
            weight: 1
          - name: project-service
            weight: 1

    frontend-service:
      loadBalancer:
        servers:
          - url: http://frontend:80

    prometheus-service:
      loadBalancer:
        servers:
          - url: http://prometheus:9090
