global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'rentflow-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Auth Service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']
    metrics_path: '/metrics'

  # Inventory Service
  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:8002']
    metrics_path: '/metrics'

  # Project Service
  - job_name: 'project-service'
    static_configs:
      - targets: ['project-service:8003']
    metrics_path: '/metrics'

  # Scanner Service
  - job_name: 'scanner-service'
    static_configs:
      - targets: ['scanner-service:8004']
    metrics_path: '/metrics'

  # Warehouse Service
  - job_name: 'warehouse-service'
    static_configs:
      - targets: ['warehouse-service:8005']
    metrics_path: '/metrics'

  # Invoice Service
