global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'rentflow-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - 'alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Auth Service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['localhost:8001']
    metrics_path: '/metrics'

  # Inventory Service
  - job_name: 'inventory-service'
    static_configs:
      - targets: ['localhost:8002']
    metrics_path: '/metrics'

  # Project Service
