version: '3.8'

services:
  # PostgreSQL for relational data
  postgres:
    image: postgres:16-alpine
    container_name: rentflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentflow

  # KurrentDB for event sourcing
  kurrentdb:
    image: ghcr.io/eventstore/eventstore:24.2.0
    container_name: rentflow-kurrentdb
    environment:
      EVENTSTORE_CLUSTER_SIZE: 1
      EVENTSTORE_RUN_PROJECTIONS: All
      EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
      EVENTSTORE_ENABLE_EXTERNAL_TCP: "true"
    ports:
      - "1113:1113"
      - "2113:2113"
    volumes:
      - kurrentdb_data:/var/lib/eventstore
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2113/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentflow

  # Traefik for API Gateway
  traefik:
    image: traefik:v2.10
    container_name: rentflow-traefik
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/dynamic:/etc/traefik/dynamic
    networks:
      - rentflow

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: rentflow-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - rentflow

volumes:
  postgres_data:
  kurrentdb_data:
  prometheus_data:

networks:
  rentflow:
    driver: bridge
