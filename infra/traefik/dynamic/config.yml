################################################################################
# Traefik Dynamic Configuration
# Middleware definitions and infrastructure routes
# Service routing is handled by Docker labels in docker-compose.yml
################################################################################

http:
  middlewares:
    securityHeaders:
      headers:
        contentTypeNosniff: true
        browserXssFilter: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 63072000
        stsPreload: true
        frameDeny: true
        customFrameOptionsValue: "SAMEORIGIN"
        customRequestHeaders:
          X-EquipFlow-Version: "1.4.0"
          X-Content-Type-Options: "nosniff"

    corsHeaders:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost:80"
          - "http://localhost"
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - X-Tenant-ID
          - X-Request-ID
          - Accept
        accessControlAllowCredentials: true
        accessControlMaxAge: 100
        addVaryHeader: true

    rateLimit:
      rateLimit:
        average: 100
        period: 60s
        burst: 50

    gzip:
      compress:
        minResponseBodyBytes: 1000

  routers:
    dashboard:
      rule: "Path(`/dashboard`) || Path(`/api/rawdata`)"
      service: api@internal
      middlewares:
        - securityHeaders

    prometheus:
      rule: "PathPrefix(`/prometheus`)"
      service: prometheus
      middlewares:
        - securityHeaders

  services:
    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"
