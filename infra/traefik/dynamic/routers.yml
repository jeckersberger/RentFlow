http:
  routers:
    # Auth Service
    auth-service:
      rule: "Host(`localhost`) && PathPrefix(`/auth`)"
      service: auth-service
      middlewares:
        - strip-prefix

    # Inventory Service
    inventory-service:
      rule: "Host(`localhost`) && PathPrefix(`/inventory`)"
      service: inventory-service
      middlewares:
        - strip-prefix

    # Project Service
    project-service:
      rule: "Host(`localhost`) && PathPrefix(`/projects`)"
      service: project-service
      middlewares:
        - strip-prefix

    # Scanner Service
    scanner-service:
      rule: "Host(`localhost`) && PathPrefix(`/scan`)"
      service: scanner-service
      middlewares:
        - strip-prefix

    # Warehouse Service
    warehouse-service:
      rule: "Host(`localhost`) && PathPrefix(`/warehouse`)"
      service: warehouse-service
      middlewares:
        - strip-prefix

    # Invoice Service
    invoice-service:
      rule: "Host(`localhost`) && PathPrefix(`/invoices`)"
      service: invoice-service
      middlewares:
        - strip-prefix

    # Document Service
    document-service:
      rule: "Host(`localhost`) && PathPrefix(`/documents`)"
      service: document-service
      middlewares:
        - strip-prefix

    # Crew Service
    crew-service:
      rule: "Host(`localhost`) && PathPrefix(`/crews`)"
      service: crew-service
      middlewares:
        - strip-prefix

    # Federation Service
    federation-service:
      rule: "Host(`localhost`) && PathPrefix(`/federation`)"
      service: federation-service
      middlewares:
        - strip-prefix

    # Maintenance Service
    maintenance-service:
      rule: "Host(`localhost`) && PathPrefix(`/maintenance`)"
      service: maintenance-service
      middlewares:
        - strip-prefix

    # Transport Service
    transport-service:
      rule: "Host(`localhost`) && PathPrefix(`/transport`)"
      service: transport-service
      middlewares:
        - strip-prefix

    # Insurance Service
    insurance-service:
      rule: "Host(`localhost`) && PathPrefix(`/insurance`)"
      service: insurance-service
      middlewares:
        - strip-prefix

    # Workflow Service
    workflow-service:
      rule: "Host(`localhost`) && PathPrefix(`/workflows`)"
      service: workflow-service
      middlewares:
        - strip-prefix

    # AI Service
    ai-service:
      rule: "Host(`localhost`) && PathPrefix(`/ai`)"
      service: ai-service
      middlewares:
        - strip-prefix

    # Notification Service
    notification-service:
      rule: "Host(`localhost`) && PathPrefix(`/notifications`)"
      service: notification-service
      middlewares:
        - strip-prefix

    # Reporting Service
    reporting-service:
      rule: "Host(`localhost`) && PathPrefix(`/reports`)"
      service: reporting-service
      middlewares:
        - strip-prefix

    # Audit Service
    audit-service:
      rule: "Host(`localhost`) && PathPrefix(`/audit`)"
      service: audit-service
      middlewares:
        - strip-prefix

    # Expense Service
    expense-service:
      rule: "Host(`localhost`) && PathPrefix(`/expenses`)"
      service: expense-service
      middlewares:
        - strip-prefix

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8001"

    inventory-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8002"

    project-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8003"

    scanner-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8004"

    warehouse-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8005"

    invoice-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8006"

    document-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8007"

    crew-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8008"

    federation-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8009"

    maintenance-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8010"

    transport-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8011"

    insurance-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8012"

    workflow-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8013"

    ai-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8014"

    notification-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8015"

    reporting-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8016"

    audit-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8017"

    expense-service:
      loadBalancer:
        servers:
          - url: "http://localhost:8018"

  middlewares:
    strip-prefix:
      stripPrefix:
        prefixes:
          - /auth
          - /inventory
          - /projects
          - /scan
          - /warehouse
          - /invoices
          - /documents
          - /crews
          - /federation
          - /maintenance
          - /transport
          - /insurance
          - /workflows
          - /ai
          - /notifications
          - /reports
          - /audit
          - /expenses
