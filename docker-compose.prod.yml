# =============================================================================
# RentFlow Production Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================
#
# This file overrides docker-compose.yml for production:
# - Resource limits (memory, CPU)
# - No exposed ports except 80/443 (Traefik handles routing)
# - Security hardening (read-only FS, dropped capabilities)
# - JSON log rotation
# - Health checks with start_period
# =============================================================================

version: '3.8'

services:
  # ============================================================================
  # INFRASTRUCTURE
  # ============================================================================

  traefik:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Dashboard NOT exposed in production (access via internal network only)
    mem_limit: 256m
    cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  kurrentdb:
    restart: unless-stopped
    ports: []
    mem_limit: 512m
    cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2113/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    restart: unless-stopped
    ports: []
    mem_limit: 1g
    cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentflow}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    restart: unless-stopped
    ports: []
    mem_limit: 256m
    cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    restart: unless-stopped
    ports: []
    mem_limit: 512m
    cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ============================================================================
  # MICROSERVICES -- Production Overrides
  # All services: no exposed ports, resource limits, security hardening
  # ============================================================================

  auth-service:
    restart: unless-stopped
    ports: []
    mem_limit: 256m
    cpus: '0.25'
    logging: &service-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      LOG_LEVEL: warn
    security_opt: &service-security
      - no-new-privileges:true
    cap_drop: &cap-drop-all
      - ALL
    cap_add: &cap-add-net
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

