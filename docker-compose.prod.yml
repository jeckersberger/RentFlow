version: '3.8'

services:
  # Go Microservices - Production Overrides
  auth-service:
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      LOG_LEVEL: warn
      GIN_MODE: release
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports: []

